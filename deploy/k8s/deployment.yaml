apiVersion: apps/v1
kind: Deployment
metadata:
  name: docintel
  namespace: docintel
  labels:
    app: docintel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docintel
  template:
    metadata:
      labels:
        app: docintel
    spec:
      containers:
        - name: docintel
          image: docintel:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: docintel-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
