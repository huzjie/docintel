apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docintel.fullname" . }}
  labels:
    app: {{ include "docintel.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "docintel.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "docintel.name" . }}
    spec:
      containers:
        - name: docintel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
