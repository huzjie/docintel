[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "1.0.0"
description = "智能文档解析与结构化抽取平台 — 非结构化文档 -> AI-ready 结构化数据"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[project.scripts]
docintel = "docintel.cli:main"

[tool.setuptools.packages.find]
include = ["docintel*"]
